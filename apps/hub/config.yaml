server:
  port: 8087
  jwt_secret: "your-super-secret-jwt-key-change-me"
  public_url: "http://localhost:8087/ai-collab-hub"
database:
  driver: sqlite3
  dsn: "./data.db"
storage:
  upload_dir: "./uploads"
  max_size_mb: 100
llm:
  default_provider: "openai"
  default_model: "gpt-4o-mini"
  max_tokens: 4096
  timeout_seconds: 60
  # 可通过 API 动态添加更多 provider，或设置环境变量:
  # export OPENAI_API_KEY=sk-xxx
  # export ANTHROPIC_API_KEY=sk-ant-xxx
